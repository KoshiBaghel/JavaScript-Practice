<!DOCTYPE html>
<html>
    <head>
        <title>
            Background Colour Change
        </title>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                height: 80vh;
            }
            .box{
                text-align: center;
                border-radius: 20px;
            }
            h1{
                color: aliceblue;
                font-size: 50px;
            }
            button{
                border-radius: 8px;
                padding: 20px;
                margin: 10px;
                width: 15%;
                font-size: 17px;
                color: white;
                border: 3px solid ghostwhite;
            }
            #red{
                background-color: rgb(245, 75, 75);
            }
            #yellow{
                background-color: rgb(246, 246, 57);
            }
            #pink{
                background-color: rgb(247, 201, 209);
            }
            #green{
                background-color: rgb(12, 161, 12);
            }
            #orange{
                background-color: rgb(248, 180, 53);
            }
            #blue{
                background-color: rgb(63, 63, 249);
            }
            #brown{
                background-color: rgb(142, 47, 47);
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h1>Interchangeable Background Colour</h1>
            <button id="red">Red</button>
            <button id="yellow">Yellow</button>
            <button id="pink">Pink</button>
            <button id="green">Green</button>
            <button id="orange">Orange</button>
            <button id="blue">Blue</button>
            <button id="brown">Brown</button>
        </div>

        <script>
            let redBtn = document.getElementById("red");
            let yellowBtn = document.getElementById("yellow");
            let pinkBtn = document.getElementById("pink");
            let greenBtn = document.getElementById("green");
            let orangeBtn = document.getElementById("orange");
            let blueBtn = document.getElementById("blue");
            let brownBtn = document.getElementById("brown");

            redBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "red";
            });
            yellowBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "yellow";
            });
            pinkBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "pink";
            });
            greenBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "green";
            });
            orangeBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "orange";
            });
            blueBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "blue";
            });
            brownBtn.addEventListener("click", function(){
                document.body.style.backgroundColor = "brown";
            });
        </script>
    </body>
</html>
