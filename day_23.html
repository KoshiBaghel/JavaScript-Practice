<!DOCTYPE html>
<html>
    <head>
        <title>
            API Part 
        </title>
    </head>
    <body>
        <script>
            fetch("https://jsonplaceholder.typicode.com/users")
           
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                for(let i = 0; i < data.length; i++) {
                    console.log(data[i].name);
                    console.log(data[i].email);
                    console.log(" ");
            }
            });       
        </script>
    </body>
</html>
