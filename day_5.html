<!DOCTYPE html>
<html>
    <head>
        <title>
            While Loop 
        </title>
        <script type="text/Javascript">

        // Sum of 1 to 10 numbers -
            let i = 1;
            let sum = 0;
            while ( i <= 10) {
                sum = sum + i;
                i++;
            }
            console.log("Sum = ", sum);

        // 1 to 100 number divisible by 5 -
            let a = 5;
            console.log("Multiple of 5 ");
            while (a <= 100){
                console.log(a);
                a+=5;
            }
        
        // Sum of Even number between 1 to 50 -
            let b = 0;
            let c = 0;
            while (b <= 50){
                c = c + b;
                b += 2;
            }
            console.log("Sum = ", c);

        // Count of 1 to 100 number divisible by 3 -
            let d = 3;
            let e = 0;
            while (d <= 100){
                e = e + 1;
                d += 3;
            }
            console.log("Count= ", e);

        //  Table of 7 -
            let num = 7;
            let n = 1;
            while (n <= 10){
                console.log(num +" * "+ n +" = "+ num * n);
                n++;
            }
        
        // Sum or Count of 1 to 100 number divisible by 3 and 5 -
            let s_num = 1;
            let add_num = 0;
            let count_num = 0;
            while (s_num <= 100){
                if(s_num % 3 === 0 && s_num % 5 === 0){
                    add_num = add_num + s_num;
                    count_num = count_num + 1;
                }
                s_num ++;
            }
            console.log("Sum of number = ", add_num);
            console.log("Count of number = ", count_num);
        </script>
    </head>
    <body>
        <h1>All concept in console</h1>
    </body>
</html>
