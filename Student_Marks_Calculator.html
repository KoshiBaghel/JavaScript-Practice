<!DOCTYPE html>
<html>
    <head>
        <title>
            Student Marks Calculator
        </title>
        <script type="text/Javascript">

            let hindi = 75;
            let english = 65;
            let computer = 80;
            let total = hindi + english + computer; 
            let average = total/3;

            console.log("Total Marks = " , total);
            console.log("Average = ", average.toFixed(2));
            if( average >= 40){
                console.log("Result = Pass");
            } else{
                console.log("Result = Needs Improvement");
            }
        </script>
    </head>
    <body>
        <h1>All concept in console</h1>
    </body>
</html>
