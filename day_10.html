<!DOCTYPE html>
<html>
    <head>
        <title>
            Document Object Model
        </title>
    </head>
    <body>
        <h1 id="heading">My Learning Journey Started.</h1>
        <p id="para">I am learning JavaScript.</p>
        <button id="my_btn">Change Text</button>

        <script type="text/Javascript">
            let heading = document.getElementById('heading');
            let paragraph = document.getElementById('para');
            let button = document.getElementById('my_btn');

            button.addEventListener("click", function(){
                heading.textContent = "My Learning Journey Started with JavaScript DOM!";
                heading.style.backgroundColor = "yellow";
                heading.style.fontSize = "40px";
                paragraph.style.backgroundColor = "lightblue";
                button.textContent = "Complete!";
                button.style.borderRadius = " 10px";
            });
        </script>
    </body>
</html>
