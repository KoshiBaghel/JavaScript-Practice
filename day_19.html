<!DOCTYPE html>
<html>
    <head>
        <title>
            Ketboard Event
        </title>
    </head>
    <body>
        <input id="text" type="text" placeholder="Type Something">
        <script>
            let text = document.getElementById("text");
            text.addEventListener('keydown', function(event){
                console.log("Pressed Key is = ",event.key);
                console.log("Physical Key of keyboard = ",event.code);
            });
        </script>
    </body>
</html>
